name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test (index provider vs the rig)
        run: dotnet test SpecAnchor.sln --nologo
      - name: Rig smoke — the fake legacy still runs
        run: dotnet run --project rig/legacy-factoring/src/FactoringApp
      - name: Gate — the rig discovery sample passes all catalog gates
        run: >
          dotnet run --project core/cli/SpecAnchor.Cli -- gate
          --discovery rig/legacy-factoring/discovery
          --src rig/legacy-factoring/src
          --sql rig/legacy-factoring/sql
          --schemas core/schemas
      - name: Mutation — the parity calculation core (break at 75)
        run: |
          dotnet tool restore
          dotnet stryker
